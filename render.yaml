services:
  - type: web
    name: assistente-precificacao
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: assistente-precificacao-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_URL
        sync: false

databases:
  - name: assistente-precificacao-db
    plan: free
    databaseName: assistente_precificacao
    user: assistente_precificacao
    postgresMajorVersion: "18"
