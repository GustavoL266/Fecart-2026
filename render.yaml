services:
  - type: web
    name: assistente-precificacao
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: assistente-precificacao-db
          property: connectionString
      - key: FOCUS_NFE_BASE_URL
        value: https://api.focusnfe.com.br
      - key: FOCUS_NFE_TIMEOUT_MS
        value: "5000"
      - key: FOCUS_NFE_TOKEN
        sync: false
      - key: AMAZON_CREATORS_CREDENTIAL_ID
        sync: false
      - key: AMAZON_CREATORS_CREDENTIAL_SECRET
        sync: false
      - key: AMAZON_CREATORS_CREDENTIAL_VERSION
        value: "3.1"
      - key: AMAZON_PARTNER_TAG
        sync: false
      - key: AMAZON_MARKETPLACE
        value: www.amazon.com.br
      - key: AMAZON_CREATORS_TIMEOUT_MS
        value: "5000"

databases:
  - name: assistente-precificacao-db
    plan: free
    databaseName: assistente_precificacao
    user: assistente_precificacao
    postgresMajorVersion: "18"
